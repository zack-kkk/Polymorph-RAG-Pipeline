version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: polymorph_pgvector
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: polymorph_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
